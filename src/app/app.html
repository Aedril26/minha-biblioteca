<ng-container *ngIf="mostrarMenu; else semMenu">
  <div class="layout">
    <aside class="sidebar">
      <a class="sidebar-marca" routerLink="/dashboard">Minha biblioteca</a>
      <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="ativo">Dashboard</a>
      </nav>
      <button type="button" class="sidebar-sair" (click)="sair()">Sair</button>
    </aside>
    <main class="conteudo">
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-container>

<ng-template #semMenu>
  <router-outlet></router-outlet>
</ng-template>
