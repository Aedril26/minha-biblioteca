<div class="auth">
  <section class="auth-lado">
    <div class="auth-marca">
      <svg class="auth-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" />
        <path d="M2 6h4" /><path d="M2 10h4" /><path d="M2 14h4" /><path d="M2 18h4" />
        <path d="M18.4 2.6a2.17 2.17 0 0 1 3 3L16 11l-4 1 1-4Z" />
      </svg>
      <div>
        <h1>Junte-se<br />à nossa<br />biblioteca</h1>
        <hr class="auth-linha" />
      </div>
    </div>
  </section>

  <section class="auth-form">
    <span class="circulo c1"></span><span class="circulo c2"></span>
    <span class="circulo c3"></span><span class="circulo c4"></span>

    <form class="auth-card auth-card-alto" [formGroup]="form" (ngSubmit)="criarConta()" novalidate>
      <h2>Criar conta</h2>

      <div class="campo-auth">
        <label for="nome">Nome Completo</label>
        <input id="nome" type="text" formControlName="nome" placeholder="Seu nome completo" />
        <small class="erro-campo" *ngIf="msg('nome') as m">{{ m }}</small>
      </div>
      <div class="campo-auth">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="seu.email@exemplo.com" />
        <small class="erro-campo" *ngIf="msg('email') as m">{{ m }}</small>
      </div>
      <div class="campo-auth">
        <label for="senha">Senha</label>
        <input id="senha" type="password" formControlName="senha" placeholder="Crie uma senha (mín. 6 caracteres)" />
        <small class="erro-campo" *ngIf="msg('senha') as m">{{ m }}</small>
      </div>
      <div class="campo-auth">
        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" type="password" formControlName="confirmar" placeholder="Repita a senha" />
        <small class="erro-campo" *ngIf="msg('confirmar') as m">{{ m }}</small>
      </div>

      <p class="erro" *ngIf="erro">{{ erro }}</p>

      <div class="auth-acoes auth-acoes-centro">
        <button type="submit" class="btn btn-caramelo" [disabled]="carregando">
          {{ carregando ? 'Criando...' : 'Criar conta' }}
        </button>
      </div>
      <p class="dica"><a routerLink="/login">Já tenho conta</a></p>
    </form>
  </section>
</div>
